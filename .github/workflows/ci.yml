name: CI (持续集成质量门禁)

on:
  push:
    branches:
      - main
      - master
      - 'feat*'
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  lint-and-build:
    name: 类型检查、脚本语法与构建验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 静态校验工程脚本与 Git 钩子语法与规范 (Bash Syntax & ShellCheck)
        run: |
          if ls scripts/*.sh >/dev/null 2>&1; then
            bash -n scripts/*.sh
            shellcheck --severity=warning scripts/*.sh
          fi
          if [ -d .githooks ]; then
            # 过滤仅对包含 Shell Shebang 的实际钩子脚本执行静态校验（自动跳过文档与占位文件）
            HOOK_FILES=$(grep -l '^#!' .githooks/* 2>/dev/null || true)
            if [ -n "$HOOK_FILES" ]; then
              echo "$HOOK_FILES" | xargs -r bash -n
              echo "$HOOK_FILES" | xargs -r shellcheck --severity=warning
            fi
          fi

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 环境 (20.x)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 确定性安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 严格 TypeScript 类型检查
        run: pnpm typecheck

      - name: 生产级静态站点编译构建
        run: pnpm build
