# ==============================================================================
# 工作流：Release (全自动发版、生成更新日志与制品挂载)
# 适用场景：基于语义化版本规范的自动化 Release 归档与静态站点分发包挂载
# 触发通道：
#   - 标签推送 (push tags: v*): 本地运行 scripts/release.sh (或 pnpm release) 打 Tag 并推送
#   - 网页调度 (workflow_dispatch): 在 GitHub Actions 页面手动输入目标版本号
# 核心特性：
#   - 遵循最小权限原则：顶层 contents: read，Job 级 contents: write
#   - 包含并发控制互斥锁，全局单例排队执行，确保发版原子性与产物完整性
#   - 自动编译生产静态产物、打包 Zip 分发包并生成 SHA-256 安全校验和清单 (checksums.txt)
#   - 调度 git-cliff 提取语义化增量更新说明 (CHANGELOG_RELEASE.md)
#   - 通过 softprops/action-gh-release 自动创建 GitHub Release 并挂载制品附件
#   - 支持双模鉴权 (RELEASE_PAT || GITHUB_TOKEN)，突破防死循环限制级联触发下游工作流
# ==============================================================================

name: Release (全自动发版与制品挂载)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '拟发布的目标版本号 (必须以 v 开头，例如 v1.2.0)'
        required: true
        type: string

# 并发控制：同一时间全局仅允许一个发版任务运行，禁止取消正在执行的任务以确保产物完整性与原子性
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# 最小权限原则：顶层仅授予代码仓库只读权限
permissions:
  contents: read

jobs:
  # ============================================================================
  # 核心 Job: 构建静态产物、生成变更日志并发布 GitHub Release
  # ============================================================================
  github-release:
    name: 构建产物与发布 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 与挂载附件所需权限
    outputs:
      tag_name: ${{ steps.release-meta.outputs.tag_name }}
      raw_version: ${{ steps.release-meta.outputs.raw_version }}
      is_prerelease: ${{ steps.release-meta.outputs.is_prerelease }}
    steps:
      - name: 检出源码 (全量历史供 git-cliff 分析，支持双模鉴权)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: 解析发版元数据
        id: release-meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          
          # 语义化版本正则双重防呆：阻断非标原生标签误触发发版
          if ! echo "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::推送的标签 [$TAG_NAME] 不符合语义化版本规范！必须形如 v1.0.0 或 v1.0.0-rc.1，已安全终止发版流水线。"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          RAW_VERSION="${TAG_NAME#v}"
          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$TAG_NAME" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 pnpm
        uses: pnpm/action-setup@v6

      - name: 设置 Node.js 环境 (22.x LTS)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 静态类型检查
        run: pnpm run typecheck

      - name: 编译生产级静态站点产物
        run: pnpm run build

      - name: 打包静态产物并生成校验和清单
        run: |
          mkdir -p dist-artifacts
          ZIP_NAME="ateng-mcp-dist-${{ steps.release-meta.outputs.tag_name }}.zip"
          
          # 将编译好的 docs/.vitepress/dist 压缩打包
          cd docs/.vitepress/dist && zip -r "../../../dist-artifacts/$ZIP_NAME" . && cd ../../..
          
          # 自动计算 SHA-256 校验和并写入清单
          cd dist-artifacts
          sha256sum "$ZIP_NAME" > checksums.txt
          cd ..

      - name: 生成发布日志 (基于 git-cliff 与 Conventional Commits)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --tag ${{ steps.release-meta.outputs.tag_name }} --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG_RELEASE.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 GitHub Release 并挂载制品
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag_name }}
          name: ${{ steps.release-meta.outputs.tag_name }}
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ steps.release-meta.outputs.is_prerelease == 'true' }}
          files: |
            dist-artifacts/*.zip
            dist-artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ==============================================================================
# 💡 容器镜像构建与多场景部署流水线解耦指引
# ------------------------------------------------------------------------------
# 1. 多架构 Docker 镜像构建 (GHCR): 已解耦至独立流水线 .github/workflows/docker.yml
#    - 打 Tag 发版时，docker.yml 与 release.yml 自动并行执行，极大缩短发版耗时；
#    - 代码合并至 main/master 分支时，docker.yml 亦可自动刷新 latest 与 short-sha 镜像。
# ==============================================================================
