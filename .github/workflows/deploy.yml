# ==============================================================================
# 工作流：Deploy - GitHub Pages (官方静态文档站点自动化部署)
# 适用场景：Ateng MCP 官方技术文档中心零服务器托管
# 触发条件：
#   - push: 主干分支 (main) 代码提交与合并自动触发
#   - workflow_dispatch: 网页控制台手动调度触发
# 核心特性：
#   - 双 Job 解耦：独立构建静态产物与安全沙箱部署
#   - Node.js 22 LTS 现代化官方 Actions 套件 (checkout@v7, setup-node@v6, upload-pages@v5)
#   - 遵循最小权限原则：顶层 contents: read，Job 级授予 pages: write 与 id-token: write
#   - 部署完成后将线上页面访问地址绑定至 GitHub Environment
#   - 内置生产环境自动化健康检查与冒烟测试 (Smoke Test)
# ==============================================================================

name: 部署 Ateng MCP 文档中心 至 GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 最小权限原则：顶层仅授予代码仓库只读权限
permissions:
  contents: read

# 防止并发部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建生产级静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm 包管理工具
        uses: pnpm/action-setup@v6

      - name: 配置 Node.js 运行时 (22.x LTS)
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 识别 GitHub Pages 路由前缀
        uses: actions/configure-pages@v6

      - name: 恢复依赖缓存并安装
        run: pnpm install --frozen-lockfile

      - name: 静态类型诊断检查
        run: pnpm run typecheck

      - name: 编译构建全站静态文档与博客
        run: pnpm run build

      - name: 上传 GitHub Pages 构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: 自动化发布到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write     # 部署至 GitHub Pages 所需的核心写权限
      id-token: write  # GitHub Pages OIDC 鉴权所需权限
    steps:
      - name: 执行 GitHub Pages 部署发布
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 生产环境健康检查与冒烟测试 (Smoke Test)
        run: |
          DEPLOYED_URL="${{ steps.deployment.outputs.page_url }}"
          HEALTH_URL="${{ vars.APP_HEALTH_CHECK_URL || '' }}"
          TARGET_URL="${HEALTH_URL:-$DEPLOYED_URL}"

          if [ -z "$TARGET_URL" ]; then
            echo "::warning::未获取到 GitHub Pages 访问 URL，跳过冒烟测试。"
          else
            echo "正在对 GitHub Pages 访问地址执行健康冒烟探测: $TARGET_URL ..."
            curl --fail --retry 5 --retry-delay 5 --max-time 10 "$TARGET_URL"
            echo "✅ GitHub Pages 发布就绪，冒烟探测通过！"
          fi
