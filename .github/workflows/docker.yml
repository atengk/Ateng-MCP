# ==============================================================================
# 工作流：Docker (GHCR 多架构容器镜像构建与发布)
# 适用场景：基于 Node.js 编译与 Nginx Alpine 生产运行时的多架构容器化构建与分发
# 触发条件：
#   - push: 主干分支 (main) 代码推送，自动构建并推送 latest 与 short-sha 镜像
#   - push: 语义化版本标签 (v*) 推送，自动解析并推送 SemVer 五维标签矩阵镜像
#   - workflow_dispatch: 网页控制台随时手动调度触发
# 核心特性：
#   - 遵循最小权限原则：顶层 contents: read，Job 级 packages: write
#   - QEMU 模拟器 + Docker Buildx 交叉编译 linux/amd64 与 linux/arm64 双架构镜像
#   - 自动小写化仓库名称 (REPO_LC=${GITHUB_REPOSITORY,,})，彻底杜绝 Registry 大小写兼容问题
#   - 注入 provenance: false & sbom: false 策略，确保产物纯净并杜绝私有 Harbor 幽灵标签
#   - 采用 GitHub Actions 缓存 (type=gha) 极致加速多阶段构建层复用
#   - 内置单/多分支拓扑防双跑感知门禁：发版时分支流水线自动让步，消灭镜像竞态与算力浪费
# ==============================================================================

name: Docker (GHCR 多架构容器镜像构建与发布)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

# 并发控制：同一分支有新构建时自动取消旧任务；标签构建独立执行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：顶层仅授予代码仓库只读权限
permissions:
  contents: read

jobs:
  build-and-push:
    name: 构建并推送多架构 Docker 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送至 GitHub Container Registry (ghcr.io) 所需的镜像包写入权限
    steps:
      - name: 转换仓库名称为全小写 (Lowercase Repository Name)
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查分支提交是否关联发版标签 (防双跑自检)
        id: check-tag
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          git fetch --tags --force
          MATCHED_TAGS=$(git tag --points-at HEAD 'v*' 2>/dev/null || true)
          if [ -n "$MATCHED_TAGS" ]; then
            TAGS_STR=$(echo "$MATCHED_TAGS" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
            echo "检测到当前分支提交已关联语义化版本标签: [$TAGS_STR]"
            echo "当前构建将由 Tag 流水线统一发布，自动跳过分支构建以避免重复计算与镜像竞态。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "当前分支提交未关联发版标签，继续执行容器镜像构建。"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 QEMU 模拟器 (多架构支持)
        if: steps.check-tag.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        if: steps.check-tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry (ghcr.io)
        if: steps.check-tag.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据与标签矩阵
        id: meta
        if: steps.check-tag.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.REPO_LC }}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送多架构镜像 (amd64 / arm64)
        if: steps.check-tag.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # 避免生成 unknown/unknown 幽灵标签，兼容老旧 Docker 与私有 Registry 环境
          sbom: false       # 避免生成附加 SBOM attestation，保持产物纯净最大化兼容
          cache-from: type=gha
          cache-to: type=gha,mode=max
