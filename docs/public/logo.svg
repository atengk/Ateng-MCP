<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 224 224" width="100%" height="100%" fill="none">
  <defs>
    <!-- 渐变体系定义 -->
    <linearGradient id="mcpMobiusHostGrad" x1="40" y1="60" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="mcpMobiusServerGrad" x1="220" y1="60" x2="60" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="mcpCorePinGrad" x1="100" y1="128" x2="156" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="mcpAuraGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- 柔和发光与投影滤镜 -->
    <filter id="mcpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>

    <filter id="mcpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景科技光环与轨道 -->
  <circle cx="128" cy="128" r="102" fill="url(#mcpAuraGrad)" />
  <circle cx="128" cy="128" r="88" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35" />

  <!-- 主体群组：莫比乌斯双向数据协议环 (Infinity / Möbius Protocol) -->
  <g filter="url(#mcpShadow)">
    <!-- 左翼循环带 (Host / Model 端) -->
    <path d="M128 128 C100 86 64 80 44 98 C20 120 22 152 46 172 C74 194 112 170 128 128 Z"
          fill="url(#mcpMobiusHostGrad)" fill-opacity="0.95" />

    <!-- 右翼循环带 (Server / Matrix 端) -->
    <path d="M128 128 C156 170 192 176 212 158 C236 136 234 104 210 84 C182 62 144 86 128 128 Z"
          fill="url(#mcpMobiusServerGrad)" fill-opacity="0.95" />

    <!-- 交叉协议锁扣折面与立面阴影 (交汇切面) -->
    <path d="M116 112 L140 144 L132 154 L108 122 Z" fill="#312e81" opacity="0.6" />
    <path d="M140 112 L116 144 L124 154 L148 122 Z" fill="#0369a1" opacity="0.6" />

    <!-- 核心 MCP 协议引脚接口 (3 条并行 Context 总线) -->
    <g filter="url(#mcpGlow)">
      <!-- 上引脚 -->
      <line x1="114" y1="118" x2="142" y2="138" stroke="url(#mcpCorePinGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- 中引脚 (主总线) -->
      <line x1="110" y1="128" x2="146" y2="128" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <!-- 下引脚 -->
      <line x1="114" y1="138" x2="142" y2="118" stroke="url(#mcpCorePinGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- 中心物理协议核心芯片 -->
      <circle cx="128" cy="128" r="5" fill="#ffffff" />
      <circle cx="128" cy="128" r="2.5" fill="#06b6d4" />
    </g>

    <!-- 流动高光描边 (Highlight Edge) -->
    <path d="M48 94 C66 78 100 86 126 126" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M208 162 C190 178 156 170 130 130" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 象征 10 大 MCP 生产级服务端矩阵的环绕微晶粒子 -->
  <g filter="url(#mcpGlow)">
    <circle cx="128" cy="38" r="3.5" fill="#38bdf8" />  <!-- RocketMQ -->
    <circle cx="180" cy="52" r="3" fill="#818cf8" />   <!-- Kafka -->
    <circle cx="218" cy="92" r="3.5" fill="#38bdf8" />  <!-- RabbitMQ -->
    <circle cx="224" cy="144" r="3" fill="#818cf8" />  <!-- Redis -->
    <circle cx="196" cy="190" r="3.5" fill="#38bdf8" /> <!-- RDBMS -->
    <circle cx="128" cy="218" r="3.5" fill="#818cf8" /> <!-- S3 -->
    <circle cx="76" cy="204" r="3" fill="#38bdf8" />   <!-- Kubernetes -->
    <circle cx="38" cy="164" r="3.5" fill="#818cf8" />  <!-- SSH -->
    <circle cx="32" cy="112" r="3" fill="#38bdf8" />   <!-- Nacos -->
    <circle cx="68" cy="62" r="3.5" fill="#818cf8" />   <!-- Email -->
  </g>

  <!-- 协议中心脉冲微光粒子 -->
  <circle cx="128" cy="128" r="1.5" fill="#ffffff" />
</svg>
